name: Kustomize validate

# Renders every deploy/kubernetes overlay with `kustomize build` so manifest
# drift (duplicate bases, missing patches, invalid YAML) is caught in CI
# rather than at deploy time. Only runs when overlay or base files change.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/kustomize-validate.yml'
      - 'deploy/kubernetes/**'
  push:
    branches:
      - main
      - 'release/v[0-9]*'
    paths:
      - '.github/workflows/kustomize-validate.yml'
      - 'deploy/kubernetes/**'

permissions:
  contents: read

concurrency:
  group: kustomize-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  validate:
    name: Kustomize build (overlays)
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install kustomize
        env:
          KUSTOMIZE_VERSION: v5.8.3
          KUSTOMIZE_SHA256: cb9e31198d3f63b44848bd0afc4c8efc56e6cfef9c93a4a39a211940e6decd61
        run: |
          install_dir="$(mktemp -d "$RUNNER_TEMP/kustomize.XXXXXX")"
          cd "$install_dir"
          archive="kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --output "$archive" \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/$archive"
          echo "$KUSTOMIZE_SHA256  $archive" | sha256sum --check
          tar -xzf "$archive" kustomize
          ./kustomize version
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Render all overlays
        run: |
          failed=0
          for overlay in deploy/kubernetes/overlays/*/; do
            name="$(basename "$overlay")"
            echo "::group::$name"
            if kustomize build "$overlay"; then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              echo "::error::kustomize build failed for overlay '$name'"
              failed=1
            fi
          done
          exit "$failed"
