[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omnigent-linear-extension"
version = "0.1.0"
description = "Linear board and project handoff for Omnigent"
requires-python = ">=3.12"
dependencies = ["omnigent>=0.22.0.dev0,<1"]

[project.entry-points."omnigent.extensions"]
linear = "omnigent_linear_extension.plugin:get_manifest"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
omnigent_linear_extension = ["dist/extension.js", "dist/extension.css"]
